name: Local release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Validate
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
      - name: Build local artifacts
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$version" = "$GITHUB_REF_NAME" ]; then version=manual; fi
          mkdir -p "dist/release/$version"
          GOOS=linux GOARCH=amd64 go build -trimpath -o "dist/release/$version/agentfence-linux-amd64" ./cmd/agentfence
          GOOS=darwin GOARCH=arm64 go build -trimpath -o "dist/release/$version/agentfence-darwin-arm64" ./cmd/agentfence
          GOOS=windows GOARCH=amd64 go build -trimpath -o "dist/release/$version/agentfence-windows-amd64.exe" ./cmd/agentfence
           find "dist/release/$version" -maxdepth 1 -type f ! -name SHA256SUMS -print0 | xargs -0 sha256sum > "dist/release/$version/SHA256SUMS"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentfence-release-${{ github.ref_name }}
          path: dist/release
